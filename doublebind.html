<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Double Bind from Initial Alignment</title>
<style>
body{
  margin:0;
  background:#0b0d12;
  color:#e9ecf1;
  font-family:system-ui;
}
.wrap{max-width:1000px;margin:20px auto;padding:20px}
canvas{width:100%;height:360px;border:1px solid #1c2340;border-radius:12px}
button{background:#2a3cff;color:white;border:none;
  border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer}
.note{color:#a8b0c0;font-size:13px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
<h2>Double Bind: Initial Alignment → Divergence via Richness</h2>
<div class="note">
System begins aligned. Learners elaborate meaning; technical agenda remains reductive.
Teacher oscillates only after overlap collapses.
</div>
<canvas id="plot"></canvas>
<br>
<button onclick="play()">Play</button>
<button onclick="pause()">Pause</button>
<button onclick="resetAll()">Reset</button>
</div>

<script>
const canvas = document.getElementById("plot");
const ctx = canvas.getContext("2d");

function resize(){
  const dpr=window.devicePixelRatio||1;
  const r=canvas.getBoundingClientRect();
  canvas.width=r.width*dpr;
  canvas.height=r.height*dpr;
}
window.onresize=resize;
resize();

function gaussian(x,mu,s){
  const z=(x-mu)/s;
  return Math.exp(-0.5*z*z)/(s*Math.sqrt(2*Math.PI));
}

const X={min:-6,max:6};

let state={
  t:0,
  running:false,
  timer:null,

  // start aligned
  agendaMu:0,
  learnerMu:0,
  teacherMu:0,

  agendaSigma:0.6,
  learnerSigma:0.9,
  teacherSigma:1.0,

  phase:0,
  oscillating:false
};

function draw(){
  resize();
  const W=canvas.width,H=canvas.height;
  ctx.clearRect(0,0,W,H);

  const pad={l:50,r:20,t:20,b:40};
  const PW=W-pad.l-pad.r;
  const PH=H-pad.t-pad.b;

  const toX=x=>pad.l+(x-X.min)/(X.max-X.min)*PW;
  const toY=y=>pad.t+(1-y/0.6)*PH;

  // axes
  ctx.strokeStyle="#2a3350";
  ctx.beginPath();
  ctx.moveTo(pad.l,pad.t);
  ctx.lineTo(pad.l,pad.t+PH);
  ctx.lineTo(pad.l+PW,pad.t+PH);
  ctx.stroke();

  const N=800;
  let xs=[];
  for(let i=0;i<N;i++)
    xs.push(X.min+(X.max-X.min)*i/(N-1));

  const yAgenda=xs.map(x=>gaussian(x,state.agendaMu,state.agendaSigma));
  const yLearner=xs.map(x=>gaussian(x,state.learnerMu,state.learnerSigma));
  const yTeacher=xs.map(x=>gaussian(x,state.teacherMu,state.teacherSigma));

  // overlaps (teacher)
  function overlap(yA,color){
    ctx.fillStyle=color;
    ctx.beginPath();
    ctx.moveTo(toX(xs[0]),toY(0));
    for(let i=0;i<N;i++)
      ctx.lineTo(toX(xs[i]),toY(Math.min(yTeacher[i],yA[i])));
    ctx.lineTo(toX(xs[N-1]),toY(0));
    ctx.closePath();
    ctx.fill();
  }

  overlap(yAgenda,"rgba(120,160,255,0.2)");
  overlap(yLearner,"rgba(255,160,120,0.2)");

  function stroke(y,color,w){
    ctx.strokeStyle=color;
    ctx.lineWidth=w;
    ctx.beginPath();
    ctx.moveTo(toX(xs[0]),toY(y[0]));
    for(let i=1;i<N;i++)
      ctx.lineTo(toX(xs[i]),toY(y[i]));
    ctx.stroke();
  }

  stroke(yAgenda,"#7aa2ff",2.5);
  stroke(yLearner,"#ffb07a",2.5);
  stroke(yTeacher,"#ffffff",3.2);

  ctx.fillStyle="#7aa2ff";
  ctx.fillText("Digitalisation agenda",toX(state.agendaMu)-40,pad.t+14);

  ctx.fillStyle="#ffb07a";
  ctx.fillText("Learners",toX(state.learnerMu)-20,pad.t+14);

  ctx.fillStyle="#ffffff";
  ctx.fillText("Teacher",toX(state.teacherMu)-10,pad.t+PH-10);
}

function step(){
  state.t++;

  // learners elaborate language (richness grows)
  state.learnerSigma += 0.002;
  state.learnerMu += 0.004;

  // agenda remains narrow and fixed
  state.agendaSigma += (0.6-state.agendaSigma)*0.01;

  // detect loss of overlap → trigger oscillation
  const dist = Math.abs(state.learnerMu - state.agendaMu);
  if(dist > 1.5) state.oscillating=true;

  if(!state.oscillating){
    // early phase: teacher sits in middle
    state.teacherMu += (0 - state.teacherMu)*0.02;
  } else {
    // late phase: oscillation begins
    state.phase += 0.05;
    const mid = (state.agendaMu + state.learnerMu)/2;
    const amp = (state.learnerMu - state.agendaMu)/2;
    state.teacherMu = mid + Math.sin(state.phase)*amp*0.9;
  }

  draw();
}

function play(){
  if(state.running)return;
  state.running=true;
  state.timer=setInterval(step,40);
}
function pause(){
  state.running=false;
  clearInterval(state.timer);
}
function resetAll(){
  pause();
  state={
    t:0,
    running:false,
    timer:null,
    agendaMu:0,
    learnerMu:0,
    teacherMu:0,
    agendaSigma:0.6,
    learnerSigma:0.9,
    teacherSigma:1.0,
    phase:0,
    oscillating:false
  };
  draw();
}

resetAll();
</script>
</body>
</html>
